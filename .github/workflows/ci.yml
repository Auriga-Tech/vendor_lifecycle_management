name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      SITE: test_site
    steps:
      - uses: actions/checkout@v4
        with:
          path: vendor_lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install bench
        run: |
          pip install frappe-bench
          sudo apt-get update && sudo apt-get install -y libmariadb-dev
      - name: Init bench with Frappe and ERPNext (version-16)
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
          bench get-app vendor_lifecycle "$GITHUB_WORKSPACE/vendor_lifecycle"
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
      - name: Create site and install apps
        run: |
          cd ~/frappe-bench
          bench new-site "$SITE" --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%'
          bench --site "$SITE" install-app erpnext
          bench --site "$SITE" install-app vendor_lifecycle
      - name: Migrate again
        run: |
          cd ~/frappe-bench
          bench --site "$SITE" migrate
      - name: Check default records were created
        run: |
          cd ~/frappe-bench
          check() {
            out=$(bench --site "$SITE" execute frappe.db.exists --args "[\"$1\", \"$2\"]" | tail -1)
            if [ "$out" != "$2" ]; then echo "Missing $1: $2"; exit 1; fi
            echo "OK $1: $2"
          }
          check Role "Vendor Lifecycle Manager"
          check Role "Vendor Lifecycle User"
          check Workflow "Vendor KYC"
          check Workflow "Vendor Reboarding Request"
          check "Email Template" "Vendor Lifecycle Stage Failed"
      - name: Check icon and navigation after install
        run: |
          cd ~/frappe-bench/sites
          ../env/bin/python "$GITHUB_WORKSPACE/vendor_lifecycle/.github/scripts/check_icons.py" "$SITE" installed
      - name: Uninstall and check nothing is left behind
        run: |
          cd ~/frappe-bench
          bench --site "$SITE" uninstall-app vendor_lifecycle --yes --no-backup
          cd sites
          ../env/bin/python "$GITHUB_WORKSPACE/vendor_lifecycle/.github/scripts/check_icons.py" "$SITE" uninstalled
      - name: Reinstall and check icon again
        run: |
          cd ~/frappe-bench
          bench --site "$SITE" install-app vendor_lifecycle
          cd sites
          ../env/bin/python "$GITHUB_WORKSPACE/vendor_lifecycle/.github/scripts/check_icons.py" "$SITE" installed
      - name: Uninstall again and check nothing is left behind
        run: |
          cd ~/frappe-bench
          bench --site "$SITE" uninstall-app vendor_lifecycle --yes --no-backup
          cd sites
          ../env/bin/python "$GITHUB_WORKSPACE/vendor_lifecycle/.github/scripts/check_icons.py" "$SITE" uninstalled
